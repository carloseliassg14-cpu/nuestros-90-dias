<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111216">
<title>Día a día · H &amp; C</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Gloock&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
</style>
</head>
<body class="p-carlos">
<header class="top"><div class="in">
  <div class="who" id="who" role="group" aria-label="Persona">
    <button type="button" data-act="person" data-p="carlos" aria-pressed="true"><span class="av" aria-hidden="true">C</span><span class="nm">Carlos</span></button>
    <button type="button" data-act="person" data-p="hannah" aria-pressed="false"><span class="av" aria-hidden="true">H</span><span class="nm">Hannah</span></button>
  </div>
  <span class="sp"></span>
  <button type="button" class="icon-btn" id="gear" data-act="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></button>
</div></header>
<main class="wrap">
  <p class="status" id="status" role="status">Cargando…</p>
  <section id="v-day" aria-live="polite"></section>
  <section id="v-week" class="hidden"></section>
  <section id="v-money" class="hidden"></section>
</main>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button type="button" data-act="tab" data-tab="day" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Mi día</span></button>
  <button type="button" data-act="tab" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Semana</span></button>
  <button type="button" data-act="tab" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span>Dinero</span></button>
</div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/*@@JS@@*/
</script>
</body>
</html>
