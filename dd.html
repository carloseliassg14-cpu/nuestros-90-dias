<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111216">
<title>Día a día · H &amp; C</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Gloock&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE   everyday: a calm personal organiser, Apple-quiet, one person at a time
   IDEA    a pocket agenda + ledger: the day is a 24-hour dial you fill with coloured blocks
   PICTURE the day dial (ring of blocks, "now" hand, % done) and, in Dinero, the month's spend figure with category bars
   COLOUR  white / near-black ground, ink text, each person has one accent (Carlos ink, Hannah wine), blocks carry category colours
   TYPE    Manrope 800 for figures and titles, Manrope 500–700 for text
   LAYOUT  phone-first column (max 620px) with bottom tabs; on wide screens the dial sits beside the list */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#0d0e10);--ink:light-dark(#111216,#f2f2f4);--soft:light-dark(#6b6f78,#9ea3ad);
  --line:light-dark(#e9e9ec,#24262b);--card:light-dark(#f6f6f7,#17181c);--card2:light-dark(#efeff1,#1f2025);
  --acc:light-dark(#111216,#f2f2f4);--accInk:light-dark(#ffffff,#111216);
  --good:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--bad:light-dark(#b91c1c,#f87171);
  --c-train:#e5483a;--c-study:#2563eb;--c-work:light-dark(#2b2f37,#8b93a1);--c-health:#16a34a;--c-personal:#d97706;--c-social:#0891b2;--c-rest:#64748b;--c-faith:#a16207;
  --r:18px;--tabh:64px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body.p-hannah{--acc:light-dark(#7a1f35,#e0607e);--accInk:#ffffff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px;border-radius:10px}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.who{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px}
.who button{border:0;background:transparent;border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:700;min-height:40px}
.who .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card2)}
.who button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.who button[data-p=carlos][aria-pressed=true] .av{background:light-dark(#111216,#f2f2f4);color:light-dark(#fff,#111216)}
.who button[data-p=hannah][aria-pressed=true] .av{background:#7a1f35;color:#fff}
.top .sp{flex:1}
.icon-btn{border:0;background:var(--card);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.status{font-size:13px;color:var(--soft);text-align:center;padding:6px 0 0}
.status.warn{color:var(--warn)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs button{border:0;background:transparent;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--soft)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page] svg{stroke:var(--acc)}
/* shared */
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;letter-spacing:-.02em;margin:18px 0 4px;font-weight:800;text-wrap:balance}
h2{font-size:20px;line-height:1.2;margin:28px 0 12px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--soft);margin:0}
.btn{border:0;border-radius:999px;min-height:44px;padding:0 18px;font-weight:700;background:var(--card);display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,#888)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.cat[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.chip.cat[aria-pressed=true] .dot{background:#fff}
.muted{color:var(--soft)}
.nowrap{white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center}
.empty p{margin:0 0 4px}
/* date strip */
.strip{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr)) 44px;gap:4px;align-items:center;margin-top:12px}
.strip .d{border:0;background:transparent;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.strip .d b{font-size:18px;font-weight:800}
.strip .d small{font-size:12px;color:var(--soft);font-weight:700}
.strip .d i{width:5px;height:5px;border-radius:50%;background:transparent}
.strip .d.has i{background:var(--soft)}
.strip .d.today small{color:var(--acc)}
.strip .d[aria-pressed=true]{background:var(--acc);color:var(--accInk)}
.strip .d[aria-pressed=true] small{color:inherit;opacity:.8}
.strip .d[aria-pressed=true] i{background:var(--accInk)}
.strip .nav{border:0;background:var(--card);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
/* day layout */
.dayg{display:grid;gap:20px;margin-top:14px}
@media(min-width:860px){.dayg{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}.dial-card{position:sticky;top:84px}}
.dial-card{background:var(--card);border-radius:24px;padding:18px}
.dial{position:relative;width:min(100%,330px);aspect-ratio:1;margin:0 auto}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .mid{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .pct{font-size:clamp(40px,11vw,56px);font-weight:800;line-height:1;letter-spacing:-.03em}
.dial .pct small{font-size:.45em}
.dial .lbl{font-size:13px;color:var(--soft);font-weight:700}
.nowbox{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nowbox div{background:var(--bg);border-radius:14px;padding:10px 12px}
.nowbox small{display:block;font-size:12px;font-weight:700;color:var(--soft)}
.nowbox b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:1.3;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;text-align:center}
.stats b{display:block;font-size:18px;font-weight:800;white-space:nowrap}
.stats small{font-size:12px;color:var(--soft);font-weight:700}
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.daybar .t{flex:1;font-weight:800;font-size:18px;min-width:12ch}
.base-banner{background:color-mix(in srgb,var(--acc) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.base-banner p{margin:0;flex:1;min-width:16ch;font-size:15px}
/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.blk{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:stretch}
.blk .tm{text-align:right;padding-top:12px}
.blk .tm b{display:block;font-size:16px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.blk .tm small{display:block;font-size:12px;color:var(--soft);font-weight:700;white-space:nowrap}
.blk .cd{border:0;text-align:left;border-radius:16px;padding:12px 12px 12px 14px;background:color-mix(in srgb,var(--c) 13%,var(--bg));display:flex;gap:10px;align-items:center;min-height:60px;position:relative;width:100%}
.blk .cd .tx{flex:1}
.blk .cd .tt{display:block;font-weight:700;font-size:16px;line-height:1.3}
.blk .cd .mt{display:block;font-size:13px;color:var(--soft);font-weight:600}
.blk .cd .sw{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.blk.on .cd{box-shadow:0 0 0 2px var(--c)}
.blk.done .cd .tt{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.65}
.chk{border:0;flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent)}
.chk svg{width:20px;height:20px;stroke:transparent}
.blk.done .chk{background:var(--c);box-shadow:none}
.blk.done .chk svg{stroke:#fff}
.gap{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px}
.gap button{border:0;background:transparent;text-align:left;color:var(--soft);font-size:13px;font-weight:700;padding:4px 14px;border-left:2px dotted var(--line);margin-left:6px;min-height:32px}
.nowline{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center}
.nowline span{text-align:right;font-size:12px;font-weight:800;color:var(--bad)}
.nowline i{height:2px;background:var(--bad);border-radius:2px;position:relative}
.nowline i::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
/* week */
.wk{display:grid;gap:8px}
.wrow{border:0;background:var(--card);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr) 56px;gap:12px;align-items:center;text-align:left;width:100%}
.wrow .wd b{display:block;font-weight:800}
.wrow .wd small{color:var(--soft);font-size:12px;font-weight:700}
.wrow.today{box-shadow:inset 0 0 0 2px var(--acc)}
.wbar{position:relative;height:22px;border-radius:7px;background:var(--bg);overflow:hidden}
.wbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}
.wbar i.p{opacity:.38}
.wrow .pc{text-align:right;font-weight:800;white-space:nowrap}
.wrow .pc small{display:block;font-size:12px;color:var(--soft);font-weight:700}
.axis{display:grid;grid-template-columns:64px minmax(0,1fr) 56px;gap:12px;padding:0 14px;font-size:12px;color:var(--soft);font-weight:700}
.axis div{display:flex;justify-content:space-between}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.bar .nm{display:flex;gap:8px;align-items:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .nm i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.bar .tr{height:12px;border-radius:6px;background:var(--card);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--c)}
.bar .v{font-weight:800;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
/* money */
.mhead{display:flex;align-items:center;gap:8px;margin-top:14px}
.mhead .t{flex:1;font-weight:800;font-size:18px;text-transform:capitalize}
.hero{background:var(--card);border-radius:24px;padding:20px;margin-top:12px;display:grid;gap:14px}
@media(min-width:760px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:end}}
.hero .lbl{font-size:14px;font-weight:700;color:var(--soft)}
.hero .big{font-size:clamp(40px,10vw,64px);font-weight:800;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.budget{margin-top:10px}
.budget .tr{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.budget .tr i{display:block;height:100%;background:var(--acc);border-radius:5px}
.budget.over .tr i{background:var(--bad)}
.budget small{font-size:13px;color:var(--soft);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpis div{background:var(--bg);border-radius:14px;padding:10px 12px}
.kpis small{display:block;font-size:12px;font-weight:700;color:var(--soft)}
.kpis b{font-size:17px;font-weight:800;white-space:nowrap}
.kpis .pos{color:var(--good)}.kpis .neg{color:var(--bad)}
.fig{position:relative;height:150px;margin-top:4px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:12px;fill:var(--soft);font-weight:700}
.synccard{margin-top:14px;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px}
.synccard p{margin:0;font-size:14px}
.synccard .msg{font-weight:700}
.synccard .msg.err{color:var(--bad)}
.synccard .msg.ok{color:var(--good)}
.addrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.addrow .btn{min-height:52px;font-size:16px}
.money-g{display:grid;gap:4px}
@media(min-width:860px){.money-g{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}}
.mlist{list-style:none;margin:0;padding:0}
.mday{font-size:13px;font-weight:800;color:var(--soft);padding:14px 2px 6px;text-transform:capitalize}
.mv{border:0;background:transparent;width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}
.mv .ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,var(--bg));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:15px;position:relative}
.mv .ic.rev::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.mv .nm{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .mt{font-size:13px;color:var(--soft);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .am{font-weight:800;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.mv .am small{display:block;font-size:12px;color:var(--soft);font-weight:700}
.mv .am.in{color:var(--good)}
.mv.off .nm,.mv.off .am{opacity:.55}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:6px}
.filters .chip{flex:none}
.chip.revchip{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;box-shadow:0 -8px 40px rgb(0 0 0/.18)}
.sheet{visibility:hidden}.sheet.open{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:22px;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}
.f{display:grid;gap:6px;margin-bottom:14px}
.f>label,.f>.lb{font-size:13px;font-weight:800;color:var(--soft)}
.fi{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;min-height:48px;padding:10px 14px;font-size:16px;width:100%}
.fi:focus{border-color:var(--acc);outline:0}
textarea.fi{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.amt{font-size:28px;font-weight:800;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:42px;font-weight:800}
.seg button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.14)}
.hint{font-size:13px;color:var(--soft);margin:-6px 0 12px}
.hint.warn{color:var(--warn);font-weight:700}
.hint.err{color:var(--bad);font-weight:700}
.sheet .acts{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sheet .acts .btn{flex:1;min-height:50px}
.confirm{display:none;background:color-mix(in srgb,var(--bad) 9%,var(--bg));border-radius:14px;padding:12px;margin-top:10px}
.confirm.show{display:block}
.confirm p{margin:0 0 10px;font-weight:600}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start;border-radius:14px;min-height:52px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none !important}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
@media(max-width:420px){.blk,.gap,.nowline{grid-template-columns:62px minmax(0,1fr)}.blk .tm b{font-size:15px}.wrow{grid-template-columns:44px minmax(0,1fr) 46px;gap:8px;padding:10px}.axis{grid-template-columns:44px minmax(0,1fr) 46px;gap:8px;padding:0 10px}.bar{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto}}
@media(max-width:350px){.who button{padding-right:8px}.who .nm{display:none}}

/* ----- dentro de la app "Nuestros 90 días" (embed) ----- */
:root.embed{color-scheme:light;--bg:#FAF7F6;--ink:#1C1716;--soft:#6E6764;--line:#ECE6E3;--card:#FFFFFF;--card2:#F3EEEC;--acc:#B5122B;--accInk:#ffffff;--tabh:0px}
:root.embed body{font-family:"Albert Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;background:#FAF7F6}
:root.embed body.p-hannah{--acc:#B5122B}
:root.embed h1{font-family:"Gloock",Georgia,serif;font-weight:400;color:#6E0A18;letter-spacing:0}
:root.embed h2{color:#6E0A18}
:root.embed .tabs{display:none}
:root.embed .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
:root.embed .dial-card,:root.embed .hero{background:#FFFFFF;box-shadow:0 1px 0 #ECE6E3}
:root.embed .nowbox div,:root.embed .kpis div{background:#FAF7F6}
:root.embed .who button[data-p=carlos][aria-pressed=true] .av,:root.embed .who button[data-p=hannah][aria-pressed=true] .av{background:#B5122B;color:#fff}
:root.embed .toast{bottom:calc(18px + env(safe-area-inset-bottom,0px))}

/* ===== Comida, Entreno y Jarvis (24 nov 2026) ===== */
/* alimentación y entrenamiento */
.tabs .in{grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{font-size:12px;letter-spacing:-.01em}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}

.fastbox span{font-size:14px;color:var(--soft);font-weight:600}
.fastbox.open{box-shadow:inset 4px 0 0 var(--good)}
.fastbox.fast{box-shadow:inset 4px 0 0 var(--acc)}
.tgt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.tgt div{background:var(--bg);border-radius:14px;padding:10px 12px}

.tgt b{font-size:17px;font-weight:800}
.tgt .pos{color:var(--good)}.tgt .neg{color:var(--bad)}
.hhero .tgt div{background:var(--bg)}
.tgt.out div{background:var(--card)}
.hnote{margin:0;font-size:14px;color:var(--soft)}
.cnt{font-size:14px;color:var(--soft);font-weight:700;margin-left:6px}
.hlist,.hlist2{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hcard{background:var(--card);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.hrow{display:flex;gap:10px;align-items:center}
.htx{flex:1;display:grid;gap:1px}
.hk{font-size:13px;font-weight:800;color:var(--soft)}
.ht{font-size:16px;font-weight:700;line-height:1.3}
.hn{font-size:13px;color:var(--soft);font-weight:600;line-height:1.35}
.hr{font-size:14px;font-weight:800;color:var(--c-train)}
.sug{margin:0;font-size:15px;font-weight:600}
.macro{margin:0;display:grid;gap:4px;background:var(--bg);border-radius:12px;padding:8px 12px}
.macro div{display:grid;grid-template-columns:6.6em minmax(0,1fr);gap:8px;font-size:14px;line-height:1.35}
.macro dt{font-weight:800;color:var(--soft)}
.macro dd{margin:0;font-weight:600}
.hl{background:var(--card);border-radius:16px;padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:center;min-height:60px}
.hl.ok .ht,.hcard.ok .ht{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.6}
.hchk{border:0;flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.hchk svg{width:20px;height:20px;stroke:transparent}
.hchk.on{background:var(--good);box-shadow:none}

.numin{display:flex;align-items:center;gap:6px;flex:none}
.numin .fi{width:92px;min-height:44px;padding:8px 10px;text-align:right;font-weight:800}
.numin span{font-weight:700;color:var(--soft);font-size:14px}
.pbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}

.up{list-style:none;margin:0;padding:0;display:grid;gap:0}
.up li{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.up .ud{font-weight:800}
.wtrs{display:grid;gap:6px}
.wtr{border:0;background:var(--card);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;text-align:left;align-items:center;min-height:48px}
.wtr.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.wtr span{font-weight:600}
.hdet{border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.hdet summary{cursor:pointer;padding:14px;font-weight:800;list-style-position:inside}
.hdet[open] summary{border-bottom:1px solid var(--line)}
.hol{margin:0;padding:12px 14px 12px 34px;display:grid;gap:6px;font-size:15px}
.htbl{width:100%;border-collapse:collapse;font-size:14px}
.htbl th,.htbl td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.htbl th{font-size:12px;color:var(--soft);font-weight:800}
.htbl tr:last-child td{border-bottom:0}
.htbl tr.cur td{background:color-mix(in srgb,var(--acc) 8%,transparent);font-weight:700}
.htbl td:first-child{text-transform:none}
.hfoot{font-size:13px;margin:16px 0 0}
.fbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fbtns .btn.pri{background:var(--acc)}
.fbtns .btn{background:var(--bg);min-height:50px;white-space:normal;line-height:1.2;padding:6px 12px}
.fastbox.warn{box-shadow:inset 4px 0 0 var(--warn)}
.hhero .seg{background:var(--bg)}
.hhero .seg button[aria-pressed=true]{background:var(--acc);color:var(--accInk)}
.tline{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tline li{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;padding:8px 0 8px 14px;position:relative;font-size:15px}
.tline li::before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tline b{font-weight:800;white-space:nowrap}
.jcard{border:1.5px solid color-mix(in srgb,var(--acc) 22%,var(--line));border-radius:20px;padding:14px;margin-bottom:12px;display:grid;gap:12px;background:var(--bg)}
.jcard.slim{padding:10px 14px}
.jh{display:flex;align-items:center;gap:8px;font-size:15px}
.jdot{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-weight:800;font-size:13px}
.adv{background:color-mix(in srgb,var(--warn) 10%,var(--bg));border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.adv b{font-size:17px}
.adv p{margin:0;font-size:15px}
.adv .btn{white-space:normal;line-height:1.2;text-align:center}
.jnotes{margin:0;padding:0 0 0 18px;display:grid;gap:6px;font-size:14px}
.ci{display:grid;gap:10px}
.ciq{font-size:15px}
.cin{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--soft)}
.cin .numin .fi{width:100%}
.jsync{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--soft);font-weight:600}
.jsync span{flex:1;min-width:14ch}
.jsync .err{color:var(--bad)}.jsync .ok{color:var(--good)}
.jsync .btn{min-height:40px;font-size:14px}

.jcard{margin-top:14px}
.advb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.advb .btn{min-height:48px;padding:6px 12px}
.cisum{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.cisum span{flex:1}
.cisum .btn{min-height:40px}
.jdet summary{cursor:pointer;font-weight:800;font-size:14px;padding:4px 0}
.jdet .jnotes{margin-top:8px}

   bank.js · Lectura de correos de BAC Credomatic y Banco Nacional (CR)
   Funciones puras: no tocan la red ni la página. Se prueban solas.
   © 2026 Carlos Salas González. Todos los derechos reservados.
------------------------------------------------------------------- */
const Bank = (() => {
  // Tarjetas propias de Carlos (solo últimos 4 dígitos, nunca el número completo)
  const OWN_CARDS = { "0699": "AMEX", "0235": "Mastercard", "3188": "Visa BN" };
  const OWNER_RE = /CARLOS\s+EL[IÍ]AS\s+SALAS/i;

  const MONTHS = { jan:1, ene:1, feb:2, mar:3, apr:4, abr:4, may:5, jun:6, jul:7, aug:8, ago:8, sep:9, set:9, oct:10, nov:11, dec:12, dic:12 };

  const pad = (n) => String(n).padStart(2, "0");

  // "10,000.00" -> 10000 · "3.259,80" -> 3259.8 · "13.09" -> 13.09
  function num(s) {
    s = String(s || "").trim();
    if (!s) return NaN;
    if (/,\d{2}$/.test(s) && s.indexOf(".") !== -1 && s.lastIndexOf(".") < s.lastIndexOf(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+,\d{2}$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d+,\d{2}$/.test(s)) s = s.replace(",", ".");
    else s = s.replace(/,/g, "");
    return Number(s);
  }

  function dateFrom(mon, day, year, hh, mm) {
    const m = MONTHS[String(mon).slice(0, 3).toLowerCase()];
    if (!m) return null;
    return { date: `${year}-${pad(m)}-${pad(day)}`, time: `${pad(hh)}:${pad(mm)}` };
  }

  const clean = (s) => String(s || "").replace(/\*/g, "").replace(/\s+/g, " ").trim();

  /**
   * msg: { id, subject, sender, plaintextBody, snippet, date }
   * Devuelve null si no es un comprobante de compra que se pueda leer.
   */
  function parse(msg) {
    if (!msg) return null;
    const subject = String(msg.subject || "");
    const sender = String(msg.sender || "");
    const body = String(msg.plaintextBody || msg.snippet || "");
    const isBAC = /baccredomatic/i.test(sender) || /Notificaci[oó]n de transacci[oó]n/i.test(subject);
    const isBN = /bncr\.fi\.cr/i.test(sender) || /Voucher Digital/i.test(subject);
    if (!isBAC && !isBN) return null;
    if (isBN && /OTP|Comprobaci[oó]n de Seguridad/i.test(subject)) return null;

    const out = { bank: isBAC ? "BAC" : "BN", holder: "", last4: "", merchant: "", currency: "", amount: NaN, date: "", time: "", type: "COMPRA" };

    if (isBAC) {
      const h = body.match(/Hola\s+([A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ ]+?)\s*(?:#|A continuaci|\||\n)/);
      if (h) out.holder = clean(h[1]);
      const c = body.match(/Comercio:\s*\|?\s*([^|\n]+?)\s*(?:\||\n)/);
      if (c) out.merchant = clean(c[1]);
      const a = body.match(/Monto:\s*\|?\s*([A-Z]{3})\s*([\d.,]+)/);
      if (a) { out.currency = a[1]; out.amount = num(a[2]); }
      const t = body.match(/Tipo de Transacci[oó]n:\s*\|?\s*([^|\n]+?)\s*(?:\||\n)/);
      if (t) out.type = clean(t[1]).toUpperCase();
      const f = body.match(/Fecha:\s*\|?\s*([A-Za-zÁÉÍÓÚáéíóú]{3})[a-záéíóú]*\.?\s+(\d{1,2}),?\s*(\d{4}),?\s*(\d{1,2}):(\d{2})/);
      if (f) Object.assign(out, dateFrom(f[1], f[2], f[3], f[4], f[5]) || {});
      if (!out.merchant) { const s = subject.match(/transacci[oó]n\s+(.+?)\s+\d{2}-\d{2}-\d{4}/i); if (s) out.merchant = clean(s[1]); }
      if (!out.date) { const s = subject.match(/(\d{2})-(\d{2})-(\d{4})\s*-\s*(\d{1,2}):(\d{2})/); if (s) { out.date = `${s[3]}-${s[2]}-${s[1]}`; out.time = `${pad(s[4])}:${s[5]}`; } }
    } else {
      const h = body.match(/se[ñn]or\(a\):\s*\*?\s*([A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ ]+?)\s*\*?\s*(?:\n|Reciba)/);
      if (h) out.holder = clean(h[1]);
      const k = body.match(/comprobante de\s*\*?\s*([A-ZÁÉÍÓÚÑ ]+?)\s*\*?\s*realizada/i);
      if (k) out.type = clean(k[1]).toUpperCase();
      const c = body.match(/realizada en\s*\*?(.+?)\*?\s+el\s+\*?\d/i);
      if (c) out.merchant = clean(c[1]);
      const a = body.match(/TOTAL:\s*([A-Z]{3})\s*([\d.,]+)/);
      if (a) { out.currency = a[1]; out.amount = num(a[2]); }
      const f = body.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),\s*(\d{4})\s*-\s*(\d{1,2}):(\d{2})/);
      if (f) Object.assign(out, dateFrom(f[1], f[2], f[3], f[4], f[5]) || {});
    }

    const card = body.match(/\*{3,}\s*(\d{4})/);
    if (card) out.last4 = card[1];
    if (out.currency === "CRC" || out.currency === "COL") out.currency = "CRC";
    if (!out.currency || !isFinite(out.amount) || !out.date) return null;
    if (/DEVOLUC|REVERS|ANULAC|CR[EÉ]DITO/.test(out.type)) out.amount = -Math.abs(out.amount);
    return out;
  }

  // ¿Es una compra de Carlos con una de sus tarjetas? (las extensiones de papá, Derek, Manfred y Yehudy quedan fuera)
  function isOwn(p) {
    if (!p) return false;
    const nameOk = OWNER_RE.test(p.holder || "");
    const cardOk = !!OWN_CARDS[p.last4];
    return nameOk && (cardOk || !p.last4);
  }

  // Sugerencia de categoría y destino según el comercio
  const RULES = [
    ["fuel", /\b(GAS|GASOLIN|PETROL|SERVICENTRO|DELTA|TEXACO|PUMA ENERGY|UNO ?PETROL|SHELL|GULF)\b|MI GAS/],
    ["market", /SUPER|MAXI|WALMART|PALI\b|MAS X MENOS|AUTO ?MERCADO|CARNICER|VERDULER|MARKET|PRICESMART|FRESH|MEGASUPER|PERIMERCADO|ABASTECEDOR|MINISUPER|FERIA/],
    ["food", /SODA|REST|SUBWAY|KFC|MCDONAL|PIZZA|CAFE|COFFEE|GUACAMOLE|BURGER|TACO|POLLO|STARBUCKS|SUSHI|PANADER|HELAD|BAR\b|WENDY|TACO BELL|SPOON|PIPS|BRUNCH|FOOD/],
    ["transport", /UBER|DIDI|INDRIVE|PEAJE|PARQUEO|PARKING|RITEVE|MARCHAMO|BUS\b|TAXI|AUTOPIST|GLOBOVIA/],
    ["subs", /CAPCUT|NETFLIX|SPOTIFY|APPLE|ITUNES|GOOGLE|ADOBE|SKOOL|CLAUDE|ANTHROPIC|OPENAI|CHATGPT|CANVA|ICLOUD|YOUTUBE|NOTION|PRIME|DISNEY|HBO|MICROSOFT|DROPBOX|FATHOM|CALENDLY|WINDSOR/],
    ["home", /TELECABLE|KOLBI|\bICE\b|CNFL|\bAYA\b|ASADA|LIBERTY|CLARO|MOVISTAR|ADMINISTRACION|COOPEGUANACASTE|ESPH|JASEC|ALQUILER/],
    ["travel", /LATAM|AVIANCA|COPA AIR|AIRBNB|BOOKING|HOTEL|VOLARIS|IBERIA|LUFTHANSA|CONDOR|JETBLUE|UNITED|AMERICAN AIR|EXPEDIA|HOSTEL|SANSA/],
    ["health", /FARMAC|CLINIC|HOSPITAL|LABORATORIO|LAB\b|DENT|OPTIC|MEDIC|FISIO/],
    ["sport", /GYM|FITNESS|BIKE|SPORT|DEPORT|DECATHLON|CROSSFIT/],
    ["clothes", /ZARA|H&M|NIKE|ADIDAS|PULL|BERSHKA|FOREVER|SHEIN|ROPA|TIENDA/],
    ["trading", /LUCID|TRADOVATE|NINJATRADER|RITHMIC|TOPSTEP|TRADINGVIEW|APEX/],
    ["shipping", /CORREOS DE COSTA RICA|CORREOS CR|\bDHL\b|FEDEX|AEROPOST|BOX ?CORP/],
  ];
  function guess(merchant) {
    const m = String(merchant || "").toUpperCase();
    let cat = "other";
    for (const [c, re] of RULES) if (re.test(m)) { cat = c; break; }
    let scope = "personal";
    if (/INSIDE ?506/.test(m) || cat === "shipping") scope = "biz";
    return { cat, scope };
  }

  return { parse, isOwn, guess, num, OWN_CARDS };
})();

/* ---------- time & money formatting ---------- */
function fmtTime(min, h24 = cfgOf().h24) {
  min = Math.max(0, Math.min(1440, Math.round(min)));
  let h = Math.floor(min / 60) % 24, m = min % 60;
  if (min === 1440) { h = 0; }
  if (h24) return `${min === 1440 ? 24 : h}:${pad(m)}`;
  const ap = h < 12 ? "am" : "pm";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad(m)} ${ap}`;
}
function fmtDur(min) {
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return `${m} min`;
  return m ? `${h} h ${m}` : `${h} h`;
}
function fmtMoney(v, cur, lang = cfgOf().lang) {
  const d = cur === "CRC" ? 0 : 2;
  const loc = lang === "de" ? "de-DE" : "en-US";
  const n = new Intl.NumberFormat(loc, { minimumFractionDigits: d, maximumFractionDigits: d }).format(Math.abs(v));
  const s = v < 0 ? "−" : "";
  if (lang === "de" && cur === "EUR") return `${s}${n} €`;
  return `${s}${SYM[cur] || cur + " "}${n}`;
}
const toBase = (amt, cur, c = cfgOf()) => {
  const r = { CRC: 1, USD: +c.rates.USD || 1, EUR: +c.rates.EUR || 1 };
  return amt * (r[cur] || 1) / (r[c.base] || 1);
};
function dayLabel(k) {

  if (k === tk) return t.today;

  if (k === keyOf(addDays(parseKey(tk), -1))) return t.yesterday;
  return `${t.wdLong[d.getDay()]} ${d.getDate()}`;
}
function niceDate(k) {
  const t = T(), d = parseKey(k), L = cfgOf().lang;
  if (L === "de") return `${t.wdLong[d.getDay()]}, ${d.getDate()}. ${t.months[d.getMonth()]}`;

  return `${t.wdLong[d.getDay()]} ${d.getDate()} de ${t.months[d.getMonth()]}`;
}

      return this.db.collection(coll).onSnapshot((snap) => {
        const o = {};
        snap.docs.forEach((d) => { if (d.exists) o[d.id] = d.data(); });
        cb(o, snap.metadata || {});
      }, err);
    }
    const fire = () => cb(clone(this.localAll()[coll] || {}), { fromCache: false });
    this.subs.push({ coll, fire });
    setTimeout(fire, 0);

      const ref = this.db.collection(coll).doc(id);
      if (data === null) await ref.delete(); else await ref.set(data);

    const all = this.localAll();

// One write at a time per document; the newest pending value wins.
const pend = {}, busy = {};
function put(coll, id, data) {
  if (data === null) delete D[coll][id]; else D[coll][id] = data;
  const k = coll + "/" + id;
  pend[k] = { coll, id, data };
  pump(k);
}
async function pump(k) {
  if (busy[k]) return;
  busy[k] = true;
  while (pend[k]) {
    const w = pend[k]; delete pend[k];
    try { await Store.write(w.coll, w.id, w.data); }
    catch (e) {
      const c = e && e.code;
      if (c === "permission-denied") { toast(T().noPerm); continue; }
      if (c === "unavailable") { await sleep(600 + Math.random() * 600); if (!pend[k]) pend[k] = w; continue; }
      toast(c === "invalid_argument" ? T().noPerm : c === "quota_exceeded" ? T().full : T().writeErr);
    }
  }
  busy[k] = false;
  if (Store.mode === "local") Store.subs.forEach((s) => s.coll === k.split("/")[0] && s.fire());
}

function dialSVG(blocks, isToday, isBase) {
  const R = 98, C = 120, SW = 22;
  const ang = (m) => (m / 1440) * Math.PI * 2 - Math.PI / 2;
  const pt = (a, r) => [C + r * Math.cos(a), C + r * Math.sin(a)];
  const arc = (s, e) => {
    const gap = 0.012, a0 = ang(s) + gap, a1 = Math.max(a0 + 0.01, ang(e) - gap);
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const h24 = cfgOf().h24;
  const lab = [[0, h24 ? "0" : "12 am"], [360, h24 ? "6" : "6 am"], [720, h24 ? "12" : "12 pm"], [1080, h24 ? "18" : "6 pm"]];
  let s = `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--bg)" stroke-width="${SW}"/>`;
  for (let h = 0; h < 24; h++) { const [x0, y0] = pt(ang(h * 60), R + SW / 2 + 3), [x1, y1] = pt(ang(h * 60), R + SW / 2 + (h % 6 ? 6 : 9)); s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--soft)" stroke-width="${h % 6 ? 1 : 2}" stroke-linecap="round" opacity=".55"/>`; }
  blocks.forEach((b) => {
    const col = `var(--c-${CATS.includes(b.c) ? b.c : "personal"})`;
    const on = isBase || b.done;
    s += `<path d="${arc(b.s, b.e)}" fill="none" stroke="${col}" stroke-width="${SW}" opacity="${on ? 1 : 0.38}"/>`;
  });
  if (isToday) {
    const a = ang(nowMin()), [x0, y0] = pt(a, R - SW / 2 - 10), [x1, y1] = pt(a, R + SW / 2 + 2);
    s += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/>`;
  }
  lab.forEach(([m, l]) => { const [x, y] = pt(ang(m), R - SW / 2 - 16); s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="var(--soft)">${l}</text>`; });
  return `<svg viewBox="0 0 240 240" aria-hidden="true">${s}</svg>`;
}

function renderDay() {
  const t = T(), isBase = S.base !== null, target = curTarget();

  const planned = blocks.reduce((a, b) => a + (b.e - b.s), 0);
  const doneMin = blocks.reduce((a, b) => a + (b.done ? b.e - b.s : 0), 0);

    </div>`;
  const dialMid = isBase

    : `<div class="pct">${planned ? pct : "–"}<small>${planned ? "%" : ""}</small></div><div class="lbl">${esc(blocks.length ? `${doneN} ${t.of} ${blocks.length} ${t.done}` : t.blocks(0))}</div>`;
  const stats = isBase ? "" : `<div class="stats"><div><b>${esc(fmtDur(planned))}</b><small>${esc(t.planned)}</small></div><div><b>${esc(fmtDur(doneMin))}</b><small>${esc(t.doneH)}</small></div><div><b>${esc(fmtDur(planned - doneMin))}</b><small>${esc(t.left)}</small></div></div>`;

  // timeline
  let list = "";
  if (!blocks.length) {
    const hasTpl = !isBase && blocksOf({ kind: "tpl", wd: parseKey(S.date).getDay() }).length;
    list = `<div class="empty"><p><b>${esc(isBase ? t.emptyBase : t.emptyDay)}</b></p><p class="muted">${esc(t.emptyDayHelp)}</p>
      <div class="row" style="justify-content:center;margin-top:14px">${hasTpl ? `<button class="btn pri" data-act="load-base">${esc(t.loadBase)}</button>` : ""}<button class="btn${hasTpl ? "" : " pri"}" data-act="new-block">${IC.plus}${esc(t.add)}</button></div></div>`;
  } else {
    let prevEnd = null, nowPlaced = !isToday;

    blocks.forEach((b) => {

      if (prevEnd !== null && b.s - prevEnd >= 15) list += `<li class="gap"><span></span><button data-act="new-block" data-s="${prevEnd}" data-e="${Math.min(b.s, prevEnd + 60)}">${esc(t.free)} · ${esc(fmtDur(b.s - prevEnd))} · + ${esc(t.addHere)}</button></li>`;
      const c = CATS.includes(b.c) ? b.c : "personal";
      const on = isToday && b.s <= nm && nm < b.e;

        <div class="cd" role="group">

let syncing = false, syncMsg = { kind: "", text: "" };
function setSync(kind, text) { syncMsg = { kind, text }; const el = $("syncMsg"); if (el) { el.className = "msg " + kind; el.textContent = text; } }
async function syncGmail() {
  if (syncing || S.person !== "carlos") return;
  const t = T();
  syncing = true; setSync("", t.syncing); render();
  let added = 0, skipped = 0;
  try {
    const mcp = window.claude && typeof window.claude.use === "function" ? await timeout(window.claude.use("mcp"), 10000) : null;
    if (!mcp) { setSync("err", t.syncNoMcp); return; }
    const c = cfgOf("carlos");
    const since = /^\d{4}-\d{2}-\d{2}$/.test(c.since || "") ? c.since : "2026-11-01";
    const q = `{from:notificacionbac@baccredomatic.cr from:bncontacto@bncr.fi.cr} after:${since.replace(/-/g, "/")} -subject:OTP`;
    const threads = [];
    let token = null;
    for (let i = 0; i < 10; i++) {
      const r = await mcp.callTool("Gmail", "search_threads", token ? { query: q, pageSize: 50, pageToken: token } : { query: q, pageSize: 50 });
      const p = (r && r.payload) || {};
      (p.threads || []).forEach((th) => threads.push(th));
      token = p.nextPageToken || null;
      if (!token) break;
    }
    const known = (id) => !!D.tx["g_" + id];
    let n = 0;
    for (const th of threads) {
      n++;
      if (n % 3 === 0) setSync("", t.syncProgress(n, threads.length));
      const msgs = Array.isArray(th.messages) ? th.messages : [];
      const total = th.messageCount || msgs.length;
      if (msgs.length && total <= msgs.length && msgs.every((m) => known(m.id))) continue;
      if (total === 1 && msgs.length === 1) {
        const h = String(msgs[0].snippet || "").match(/Hola\s+([A-ZÁÉÍÓÚÑÜ ]+?)\s+A continuaci/);
        if (h && !/CARLOS\s+EL[IÍ]AS\s+SALAS/i.test(h[1])) { skipped++; continue; }
      }
      const full = await mcp.callTool("Gmail", "get_thread", { threadId: th.id, messageFormat: "PLAIN_TEXT" });
      const list = (full && full.payload && full.payload.messages) || [];
      for (const m of list) {
        if (!m || !m.id || known(m.id)) continue;
        const p = Bank.parse(m);
        if (!p) continue;
        if (!Bank.isOwn(p)) { if (p.holder && !/CARLOS/i.test(p.holder)) skipped++; continue; }
        const g = Bank.guess(p.merchant);
        const doc = { person: "carlos", kind: "expense", amount: p.amount, cur: SYM[p.currency] ? p.currency : "USD", desc: p.merchant, cat: g.cat, method: "card", scope: g.scope, date: p.date, time: p.time, card: p.last4, bank: p.bank, src: "gmail", mid: m.id, rev: true, created: Date.now() };
        put("tx", "g_" + m.id, doc);
        added++;
        await sleep(60);
      }
    }
    const cc = clone(D.cfg.carlos || {}) || {};
    cc.since = keyOf(addDays(new Date(), -3));
    cc.lastSync = Date.now();
    put("cfg", "carlos", cc);
    setSync("ok", added || skipped ? t.syncDone(added, skipped) : t.syncNone);
    if (added) S.filter = "rev";
  } catch (e) {
    const code = e && e.code;
    setSync("err", code === "needs_reauth" ? t.syncAuth : code === "server_not_connected" || code === "selection_required" ? t.syncMissing : code === "not_in_manifest" || code === "approval_required" || code === "consent_required" ? t.syncDenied : t.syncErr);
  } finally {
    syncing = false;
    if (S.tab === "money") render();
  }
}

let inboxMsg = "", inboxBusy = false;

  inboxBusy = true;

    const { F, db } = Store.fs;

    let n = 0;
    const rk = (id) => (id.startsWith("op_") ? "0" : "1") + id; // primero los cambios y la semana base, después el calendario
    const docs = snap.docs.slice().sort((x, y) => (rk(x.id) < rk(y.id) ? -1 : 1));
    for (const d of docs) {
      const it = d.data() || {};
      const id = d.id;

      if (cm || /^op_[A-Za-z0-9]{1,24}$/.test(id)) {
        try {
          const j = JSON.parse(String(it.json || "null"));
          if (cm && applyCalDay(cm[1], j)) calDays++;
          if (!cm && applyOp(j)) ops++;
        } catch (e) {}
        try { await F.deleteDoc(d.ref); } catch (e) {}
        continue;
      }
      if (/^g_[A-Za-z0-9]{6,40}$/.test(id) && !D.tx[id] && isFinite(+it.amount) && /^\d{4}-\d{2}-\d{2}$/.test(String(it.date || ""))) {
        const g = Bank.guess(it.desc);
        put("tx", id, { person: "carlos", kind: "expense", amount: +it.amount, cur: SYM[it.cur] ? it.cur : "CRC", desc: String(it.desc || "").slice(0, 80), cat: g.cat, method: "card", scope: g.scope, date: it.date, time: String(it.time || ""), card: String(it.card || ""), bank: String(it.bank || ""), src: "gmail", mid: String(it.mid || ""), rev: true, created: Date.now() });
        n++;
      }
      try { await F.deleteDoc(d.ref); } catch (e) {}
    }
    if (n) { inboxMsg = T().jvNew(n); if (S.person === "carlos" && S.tab === "money") render(); }
    if (calDays) { const cc = clone(D.cfg.carlos || {}) || {}; cc.lastCal = Date.now(); put("cfg", "carlos", cc); }
    if (calDays || ops) calMsg = { kind: "ok", text: `Jarvis acomodó ${calDays ? calDays + (calDays === 1 ? " día" : " días") + " con su Google Calendar" : ""}${calDays && ops ? " y " : ""}${ops ? ops + (ops === 1 ? " cambio que usted pidió" : " cambios que usted pidió") : ""}.` };
    else if (manual) calMsg = { kind: "", text: "Al día: no hay nada nuevo de Jarvis." };
    if (calDays || ops || manual) render();
  } catch (e) { if (manual) { calMsg = { kind: "err", text: "No se pudo revisar el buzón de Jarvis. Intente de nuevo." }; render(); } } finally { inboxBusy = false; }
}

    if (Object.values(D.tpl).some((v) => v && v.person === "hannah")) return;
    if ((D.cfg.carlos || {}).seededH) return;
    const raw = Uint8Array.from(atob(SEED_H.ct), (c) => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(SEED_H.iv), (c) => c.charCodeAt(0));
    const kb = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(box));
    const key = await crypto.subtle.importKey("raw", kb, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, raw);
    const docs = JSON.parse(new TextDecoder().decode(plain));
    for (const [id, doc] of Object.entries(docs)) { put("tpl", id, doc); await sleep(40); }
    const cc = clone(D.cfg.carlos || {}) || {}; cc.person = "carlos"; cc.seededH = true; put("cfg", "carlos", cc);
  } catch (e) {}
}

/* ================================================================
   GOOGLE CALENDAR + JARVIS (acomodar el día solo)
   - Trae los eventos de Google Calendar (solo lectura) y los mete en Mi día.
   - Si un evento choca con un bloque movible (gym, estudio, inside506…),
     mueve ese bloque al hueco libre más cercano y deja una nota.
   - Clases de inglés / SalesX / roleplays cuentan como esos bloques.
   - Chequeo de la mañana (WHOOP, sueño, ánimo) → consejos con
     "Hacerle caso" o "Lo voy a hacer igual".
================================================================= */
const FIXED_IDS = ["cb_grat", "pl_mag", "pl_sleep"];
const SOFT_RE = /^cb_(libre|fam|p\d|bano|prep)/;
const PRIO = ["pl_gym", "pl_walk", "pl_m1", "pl_m3", "pl_m2", "cb_closer", "cb_ia", "cb_506a", "cb_ing", "cb_rev", "cb_506b", "pl_s2"];
const KIND_INFO = {
  class: { c: "study", n: "Clase en vivo" },
  english: { c: "study", n: "Clase de inglés: cuenta como su inglés del día" },
  closer: { c: "work", n: "Sesión de closer: cuenta como su bloque de closer" },
  roleplay: { c: "work", n: "Roleplay agendado: este no se mueve" },
  event: { c: "work", n: "Compromiso de Google Calendar" }
};
let calMsg = { kind: "", text: "" };

const isGc = (b) => String(b.id).startsWith("gc_");
const isMovable = (b) => /^(pl_|cb_)/.test(String(b.id)) && !FIXED_IDS.includes(b.id) && !isGc(b);
const isMeal = (b) => /^pl_m[123]$/.test(b.id);

function calKind(ev) {
  const sum = String(ev.summary || ""), all = sum + " " + String(ev.description || "");
  if (/role\s?play/i.test(all)) return "roleplay";
  if (/salesx|closer/i.test(sum)) return "closer";
  if (/english|ingl[eé]s/i.test(sum)) return "english";
  if (/la tribu|skool|clase/i.test(all)) return "class";
  return "event";
}
/* ---------- reconcile: fixed events win, movable blocks find the nearest free slot ---------- */
function winFor(b, pref, k) {
  const sc = daySched(k);
  switch (b.id) {
    case "pl_m1": return [pref[0] - 30, pref[0] + 120];
    case "pl_m2": return [pref[0] - 120, pref[0] + 120];
    case "pl_m3": return [pref[0] - 150, Math.max(pref[1], sc.closeT)];
    case "pl_gym": return [330, 1170];
    case "pl_walk": return [360, 1170];
    default: return String(b.id).startsWith("cb_rp_") ? [pref[0] - 180, pref[1]] : [330, Math.max(pref[1], 1170)];
  }
}
function reconcile(k, input) {
  let bl = input.map(clone);
  const notes = [];
  const gc = bl.filter(isGc);
  const classMin = gc.filter((b) => b.k === "class").reduce((a, b) => a + b.e - b.s, 0);
  const eng = gc.find((b) => b.k === "english"), clo = gc.find((b) => b.k === "closer"), rps = gc.filter((b) => b.k === "roleplay");

  // 1) credits: classes count as the blocks they replace
  bl = bl.filter((b) => {
    if (b.id === "cb_ing" && eng) { notes.push(`"${eng.t}" cuenta como su inglés de hoy: quité el bloque de inglés.`); return false; }
    if (b.id === "cb_closer" && (rps.length || clo)) {
      notes.push(rps.length ? `Tiene roleplay a las ${fmtTime(rps[0].s)}: el bloque de closer se cambió por prepararlo.` : `"${clo.t}" cuenta como su bloque de closer.`);
      return false;
    }
    if (String(b.id).startsWith("cb_rp_") && !rps.some((r) => "cb_rp_" + r.id === b.id)) return false;
    return true;
  });
  rps.forEach((r) => {
    const id = "cb_rp_" + r.id;
    if (!bl.some((b) => b.id === id)) bl.push({ id, t: "Preparar el roleplay", s: Math.max(0, r.s - 30), e: r.s, c: "work", n: "Pídale a Jarvis: prepárame para el roleplay", done: false });
  });
  const ia = bl.find((b) => b.id === "cb_ia");
  let iaDur = null;
  if (ia) {
    const pref = ia.o || [ia.s, ia.e], full = pref[1] - pref[0];
    if (classMin >= 60 && full > 60) { iaDur = 60; notes.push(`Hoy tiene ${fmtDur(classMin)} de clases en vivo: el estudio de IA por su cuenta baja a 1 h.`); }
  }

  // 2) place fixed things first
  const occ = []; // [s, e, isClass, name]
  const overlaps = (s, e, ignoreClass) => occ.find(([a, b2, cls]) => !(ignoreClass && cls) && s < b2 && a < e);
  const fixed = bl.filter((b) => !isMovable(b));
  fixed.sort((a, b) => a.s - b.s);
  fixed.forEach((b) => {
    const hit = overlaps(b.s, b.e, false);
    if (hit && isGc(b) && hit[4]) notes.push(`Choque: "${b.t}" y "${hit[3]}" son a la misma hora. Escoja uno.`);
    occ.push([b.s, b.e, isGc(b) && (b.k === "class" || b.k === "english"), b.t, isGc(b)]);
  });
  fixed.filter((b) => isGc(b) && b.e > 1290).forEach((b) => notes.push(`"${b.t}" termina a las ${fmtTime(b.e)}: acuéstese apenas termine.`));

  // 3) movable blocks, by priority
  const rank = (b) => { const i = PRIO.indexOf(b.id); return i < 0 ? (String(b.id).startsWith("cb_rp_") ? 4.5 : PRIO.length - 1.5) : i; };
  const mov = bl.filter(isMovable).sort((a, b) => rank(a) - rank(b));
  const placed = [];
  mov.forEach((b) => {
    const pref = b.o || [b.s, b.e];
    let dur = pref[1] - pref[0];
    if (b.id === "cb_ia" && iaDur) dur = iaDur;
    const ign = isMeal(b);
    const soft = SOFT_RE.test(b.id);
    const tryAt = (s, d) => !overlaps(s, s + d, ign);
    let s0 = null, d0 = dur;
    if (tryAt(pref[0], dur)) s0 = pref[0];
    else if (soft) return; // bloques libres o de transición: si chocan, se quitan sin aviso
    else {
      const [w0, w1] = winFor(b, pref, k);
      const durs = isMeal(b) ? [dur, Math.min(dur, 45), 30] : /^cb_(ia|506a|506b)$/.test(b.id) ? [dur, Math.max(30, Math.round(dur / 2 / 15) * 15)] : [dur];
      for (const d of durs) {
        const cands = [];
        for (let c = Math.max(0, w0); c + d <= Math.min(1440, w1); c += 15) cands.push(c);
        cands.sort((x, y) => Math.abs(x - pref[0]) - Math.abs(y - pref[0]) || y - x);
        const hit = cands.find((c) => tryAt(c, d));
        if (hit != null) { s0 = hit; d0 = d; break; }
      }
    }
    if (s0 == null) {
      if (!soft) notes.push(`No cupo hoy: "${b.t}". Si lo quiere hacer, búsquele espacio a mano.`);
      return;
    }
    const why = overlaps(pref[0], pref[0] + dur, ign);
    if (!soft && (s0 !== pref[0] || d0 !== pref[1] - pref[0]) && !(b.id === "cb_ia" && iaDur && s0 === pref[0] && d0 === iaDur)) {
      const moved = s0 !== pref[0];
      notes.push(moved
        ? `Moví "${b.t}" de ${fmtTime(pref[0])} a ${fmtTime(s0)}${why ? ` porque se cruza con "${why[3]}"` : ""}.`
        : `Acorté "${b.t}" a ${fmtDur(d0)} para que quepa.`);
    }
    const nb = Object.assign(b, { s: s0, e: s0 + d0 });
    if (s0 === pref[0] && d0 === pref[1] - pref[0]) delete nb.o; else nb.o = pref;
    occ.push([nb.s, nb.e, false, nb.t]);
    placed.push(nb);
  });
  return { blocks: sortB(fixed.concat(placed)), notes };
}
function reconcileSave(k) {
  const tg = { kind: "plan", date: k }, cur = blocksOf(tg);
  if (!cur.length) return;
  const r = reconcile(k, cur);
  if (JSON.stringify(sortB(cur)) !== JSON.stringify(r.blocks)) setBlocks(tg, r.blocks);
  const old = JSON.stringify(hOf(k).notes || []);
  if (old !== JSON.stringify(r.notes)) hSet(k, { notes: r.notes });
}

/* ---------- calendario: lo trae Jarvis al buzón (inbox) cada mañana y cuando Carlos le pide un cambio ---------- */
// Cada item del buzón "cal_AAAA-MM-DD_<n>" trae { json: '[{"id","t","s","e","k"}…]' } con los eventos de ese día.
function applyCalDay(k, list) {
  const sp = S.person; S.person = "carlos";
  try { return applyCalDay_(k, list); } finally { S.person = sp; }
}
function applyCalDay_(k, list) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !Array.isArray(list)) return false;
  const tg = { kind: "plan", date: k };
  const seenEv = {};
  const fresh = list.filter((x) => { if (!x || !isFinite(+x.s) || !isFinite(+x.e) || +x.e <= +x.s) return false; const key = String(x.t || "").trim().toLowerCase() + "|" + Math.round(+x.s) + "|" + Math.round(+x.e); if (seenEv[key]) return false; return (seenEv[key] = true); }).slice(0, 40).map((x) => {
    const kind = KIND_INFO[x.k] ? x.k : "event", info = KIND_INFO[kind];
    const id = "gc_" + String(x.id || uid()).replace(/[^a-zA-Z0-9]/g, "").slice(0, 40);
    return { id, t: String(x.t || "Evento").slice(0, 80), s: Math.max(0, Math.min(1440, Math.round(+x.s))), e: Math.max(0, Math.min(1440, Math.round(+x.e))), c: info.c, k: kind, n: info.n + (x.pend ? " · sin confirmar" : "") };
  });
  const prev = blocksOf(tg);
  let bl = prev;
  if (!bl.length) {
    const tpl = blocksOf({ kind: "tpl", wd: parseKey(k).getDay() });
    if (!tpl.length && !fresh.length) return false;
    bl = tpl.map((b) => Object.assign(clone(b), { id: /^(pl_|cb_)/.test(String(b.id)) ? b.id : uid(), done: false }));
  }
  const doneOf = {}; bl.forEach((b) => { if (isGc(b) && b.done) doneOf[b.id] = true; });
  const next = bl.filter((b) => !isGc(b)).concat(fresh.map((b) => Object.assign(b, { done: !!doneOf[b.id] })));
  const r = reconcile(k, next);
  if (JSON.stringify(prev) !== JSON.stringify(r.blocks)) setBlocks(tg, r.blocks);
  if (JSON.stringify(hOf(k).notes || []) !== JSON.stringify(r.notes)) hSet(k, { notes: r.notes });
  return true;
}
/* Cambios que Carlos le pide a Jarvis en el chat: item "op_<n>" con { date, add:[{t,s,e,c,n}], remove:["título o id"], slot:"am"|"pm" } */
function applyOp(o) {
  // Semana base nueva: { tpl: { "0": [bloques], … "6": [bloques] } }
  if (o && o.tpl && typeof o.tpl === "object") {
    let n = 0;
    Object.keys(o.tpl).forEach((wd) => {
      const w = +wd, list = o.tpl[wd];
      if (!(w >= 0 && w <= 6) || !Array.isArray(list)) return;
      const blocks = list.filter((x) => x && isFinite(+x.s) && isFinite(+x.e) && +x.e > +x.s && +x.s >= 0 && +x.e <= 1440).slice(0, 40)
        .map((x) => { const b = { id: /^(pl_|cb_)[a-z0-9_]{1,20}$/.test(String(x.id)) ? x.id : uid(), t: String(x.t || "Bloque").slice(0, 80), s: Math.round(+x.s), e: Math.round(+x.e), c: CATS.includes(x.c) ? x.c : "personal" }; if (x.n) b.n = String(x.n).slice(0, 120); return b; });
      if (blocks.length) { put("tpl", tplId("carlos", w), { person: "carlos", wd: w, blocks: sortB(blocks), updated: Date.now(), src: "Jarvis" }); n++; }
    });
    return n > 0;
  }
  const k = o && o.date;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(k || ""))) return false;
  const sp = S.person; S.person = "carlos";
  try {
    const tg = { kind: "plan", date: k };
    if (o.slot === "am" || o.slot === "pm") { hSet(k, { slot: o.slot }); applyToDay(k); }
    let bl = blocksOf(tg);
    if (!bl.length) bl = blocksOf({ kind: "tpl", wd: parseKey(k).getDay() }).map((b) => Object.assign(clone(b), { id: /^(pl_|cb_)/.test(String(b.id)) ? b.id : uid(), done: false }));
    const rm = (Array.isArray(o.remove) ? o.remove : []).map((x) => String(x).toLowerCase());

/* ---------- Jarvis: morning check-in and advice ---------- */
const MOODS = [["good", "Con energía"], ["ok", "Normal"], ["tired", "Cansado"], ["stress", "Muy estresado"]];
function advice(k) {
  const h = hOf(k), bl = blocksOf({ kind: "plan", date: k }), adv = h.adv || {}, out = [];
  const rec = has(h.rec) ? +h.rec : null, sl = has(h.sleepH) ? +h.sleepH : null, mood = h.mood;
  const why = [];
  if (rec != null && rec < 34) why.push(`recuperación en rojo (${rec} %)`);
  if (sl != null && sl < 6) why.push(`solo ${fmtNum(sl)} h de sueño`);
  if (mood === "stress") why.push("mucho estrés");
  const red = why.length > 0;
  const whyY = [];
  if (!red) {
    if (rec != null && rec < 67) whyY.push(`recuperación en amarillo (${rec} %)`);
    if (sl != null && sl < 7) whyY.push(`${fmtNum(sl)} h de sueño`);
    if (mood === "tired") whyY.push("se siente cansado");
  }
  const gym = bl.find((b) => b.id === "pl_gym");
  if (red && gym && !/recuper/i.test(gym.t)) out.push({ id: "rest", t: "Hoy no entrene fuerte", d: `Tiene ${why.join(", ")}. Entrenar pesado hoy le quita más de lo que le da: cambie el gym por 30 min de caminata suave y movilidad.`, act: "Cambiar el gym por caminata y movilidad" });
  if ((red || whyY.length) && bl.some((b) => b.id === "pl_s2")) out.push({ id: "nos2", t: "Hoy sin sesión 2", d: `Con ${(red ? why : whyY).join(", ")}, la segunda sesión suma cansancio y no músculo.`, act: "Quitar la sesión 2" });
  const work = bl.filter((b) => b.c === "work" || b.c === "study").reduce((a, b) => a + b.e - b.s, 0);
  const fixedMin = bl.filter(isGc).reduce((a, b) => a + b.e - b.s, 0);
  const drop = bl.find((b) => b.id === "cb_506b") || bl.find((b) => b.id === "cb_506a");
  if (drop && (work >= 480 || (red && work >= 360))) out.push({ id: "load", t: "Día muy cargado", d: `Tiene ${fmtDur(work)} de trabajo y estudio${fixedMin ? `, ${fmtDur(fixedMin)} de compromisos fijos` : ""}. Mejor quite un bloque y haga bien lo demás.`, act: `Quitar "${drop.t}"`, drop: drop.id });
  return out.filter((a) => !adv[a.id]);
}
function applyAdvice(k, id) {
  const tg = { kind: "plan", date: k }, a = advice(k).find((x) => x.id === id);
  let bl = blocksOf(tg).map(clone);
  if (id === "rest") bl = bl.filter((b) => b.id !== "pl_s2").map((b) => b.id === "pl_gym" ? Object.assign(b, { t: "Caminar suave + movilidad (recuperación)", e: b.s + 40, n: "Jarvis: hoy toca recuperar" }) : b);
  if (id === "nos2") bl = bl.filter((b) => b.id !== "pl_s2");

  hSet(k, { adv });
}
