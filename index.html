<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hannah &amp; Carlos · 90</title>
<meta name="description" content="Nuestros 90 días: hábitos diarios para Hannah y Carlos.">
<meta name="theme-color" content="#6E0A18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="H &amp; C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#B5122B;
    --wine-deep:#6E0A18;
    --wine-soft:#F6E0E3;
    --paper:#FAF7F6;
    --card:#FFFFFF;
    --ink:#1C1716;
    --muted:#6E6764;
    --line:#ECE6E3;
    --gold:#C9A15B;
    --display:"Gloock", Georgia, serif;
    --text:"Albert Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper)}
  body{font-family:var(--text);color:var(--ink);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100dvh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
  .app{max-width:480px;margin:0 auto;padding:calc(var(--safe-top) + 14px) 18px calc(var(--safe-bottom) + 96px)}
  /* Barra de pestañas: Reto · Mi día · Semana · Dinero (23 nov 2026) */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,247,246,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom)}
  .tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .tabbar button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--muted)}
  .tabbar svg{width:24px;height:24px}
  .tabbar button[aria-current="page"]{color:var(--wine)}
  .ddframe{position:fixed;left:0;right:0;top:var(--safe-top);bottom:calc(62px + var(--safe-bottom));width:100%;height:calc(100% - 62px - var(--safe-bottom) - var(--safe-top));border:0;background:var(--paper);z-index:15}
  body.dd-open .app{display:none}
  .toast{bottom:calc(var(--safe-bottom) + 80px) !important;pointer-events:none;opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s !important}
  .toast.show{opacity:1}

  /* Top bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px}
  .daycount{font-family:var(--display);font-size:1.15rem;color:var(--wine-deep);letter-spacing:.01em}
  .daycount small{font-family:var(--text);font-size:.8rem;color:var(--muted);margin-left:6px;font-weight:500}
  .langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
  .langs button{min-width:40px;height:32px;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .langs button[aria-pressed="true"]{background:var(--wine);color:#fff}
  .gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--wine-deep)}
  .gear svg{width:22px;height:22px}

  /* People */
  .people{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .person{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:left;transition:border-color .2s, background .2s}
  .person[aria-pressed="true"]{border-color:var(--wine);background:#fff}
  .person .mini{width:30px;height:28px;flex:none}
  .person b{display:block;font-weight:700;font-size:1rem}
  .person span{font-size:.8rem;color:var(--muted)}

  /* Heart */
  .stage{position:relative;margin:22px auto 6px;width:min(78vw,300px);aspect-ratio:1/0.92}
  .stage svg{width:100%;height:100%;display:block;overflow:visible}
  .heart-outline{fill:none;stroke:var(--wine);stroke-width:2.2}
  .heart-bg{fill:#F2EDEB}
  .liquid{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
  .wave{animation:wave 5s linear infinite}
  .wave.back{animation-duration:7.5s;animation-direction:reverse;opacity:.55}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  .sn{font-family:var(--display);font-size:62px}
  .so{font-family:var(--text);font-size:12.5px;font-weight:600;letter-spacing:.04em}
  .sn.dark{fill:var(--wine-deep)} .so.dark{fill:var(--muted)}
  .sn.light{fill:#fff} .so.light{fill:#FFE3E7}
  .stage.full .heart-outline{stroke:var(--gold);stroke-width:3}
  .stage.pop svg{animation:pop .7s ease}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.07)}60%{transform:scale(.97)}100%{transform:scale(1)}}
  .status{text-align:center;font-weight:600;color:var(--wine-deep);min-height:1.5em}
  .status.done{color:var(--wine)}
  .dateline{text-align:center;font-size:.85rem;color:var(--muted);margin-top:2px}
  .backtoday{display:none;margin:8px auto 0;font-size:.85rem;font-weight:700;color:var(--wine);text-decoration:underline;text-underline-offset:4px}
  .backtoday.show{display:block}

  /* Habits */
  .list{list-style:none;margin-top:22px;display:grid;gap:10px}
  .habit{width:100%;display:grid;grid-template-columns:44px 1fr 36px;align-items:center;gap:14px;padding:14px 14px 14px 12px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);text-align:left;transition:background .25s, border-color .25s, transform .12s}
  .habit:active{transform:scale(.985)}
  .habit .ico{width:44px;height:44px;border-radius:13px;background:var(--cs);color:var(--c);display:grid;place-items:center;transition:background .25s,color .25s}
  .habit .ico svg{width:24px;height:24px}
  .habit .t{font-weight:600;font-size:1.02rem;line-height:1.25}
  .habit .d{display:block;font-size:.84rem;color:var(--muted);margin-top:3px;line-height:1.35}
  .check{width:34px;height:34px;border-radius:50%;border:2px solid #D8D0CD;display:grid;place-items:center;transition:background .25s,border-color .25s}
  .check svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:opacity .2s, transform .25s}
  .habit[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
  .habit[aria-pressed="true"] .t{color:#fff}
  .habit[aria-pressed="true"] .d{color:rgba(255,255,255,.82)}
  .habit[aria-pressed="true"] .ico{background:rgba(255,255,255,.16);color:#fff}
  .habit[aria-pressed="true"] .check{background:rgba(0,0,0,.2);border-color:#fff}
  .habit[aria-pressed="true"] .check svg{opacity:1;transform:scale(1)}
  .extra-head{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.82rem;color:var(--muted)}
  .extra-head .tag{flex:none;padding:4px 10px;border-radius:999px;background:#F4ECDB;color:#8A6418;font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
  .habit.bonus{border-style:dashed;border-color:#D9C49A}
  .habit.bonus[aria-pressed="true"]{border-style:solid}
  .sugarstat{margin:-6px 0 12px;font-size:.84rem;color:var(--muted)}

  /* 90 days */
  .journey{margin-top:30px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 16px 16px}
  .journey h2{font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--wine-deep)}
  .stats{display:flex;gap:18px;margin:6px 0 14px;font-size:.88rem;color:var(--muted)}
  .stats b{color:var(--ink);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}
  .day svg{width:100%;height:100%}
  .day .h{fill:none;stroke:#DDD5D2;stroke-width:2}
  .day.part .h{fill:var(--wine-soft);stroke:#E3A9B1}
  .day.full .h{fill:var(--wine);stroke:var(--wine)}
  .day.future{opacity:.35;pointer-events:none}
  .day.today::after{content:"";position:absolute;bottom:-5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .day.sel{outline:2px solid var(--gold);outline-offset:1px}
  .legend{display:flex;gap:16px;margin-top:14px;font-size:.78rem;color:var(--muted);align-items:center;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:11px;margin-right:6px;vertical-align:-1px}

  /* Install hint */
  .hint{margin-top:18px;display:none;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--wine-deep);color:#FBE9EB;font-size:.88rem}
  .hint.show{display:flex}
  .hint svg{width:22px;height:22px;flex:none;margin-top:1px}
  .hint b{color:#fff}
  .hint button{margin-left:auto;color:#fff;font-weight:700;font-size:.85rem;padding:2px 4px}

  /* Pairing */
  .pairbar{display:none;width:100%;margin-top:14px;padding:13px 14px;border-radius:16px;background:var(--wine-soft);color:var(--wine-deep);font-weight:700;font-size:.9rem;text-align:left;align-items:center;gap:10px}
  .pairbar.show{display:flex}
  .pairbar svg{width:22px;height:22px;flex:none}
  .pair{margin-bottom:22px;padding:16px;border-radius:18px;background:#fff;border:1.5px solid var(--line)}
  .pair h4{font-size:1rem;font-weight:700;margin-bottom:4px}
  .pair p{font-size:.84rem;color:var(--muted);margin-bottom:12px}
  .pair .pst{font-weight:600;color:var(--wine-deep);margin:8px 0 0;min-height:1.2em}
  .pair .pst.ok{color:#2F6B00}
  .pair .code{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;font-weight:700;letter-spacing:.02em;padding:12px;border-radius:12px;background:var(--paper);text-align:center;margin-bottom:10px;word-break:break-all;user-select:all;-webkit-user-select:all}
  .pair .btn{width:100%;flex:none}
  .pair .join{display:flex;gap:8px;margin-top:12px}
  .pair .join input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
  .pair .join .btn{width:auto;padding:0 16px}
  .pair .lbl{font-size:.85rem;font-weight:600;color:var(--muted);margin-top:14px;display:block}
  .pair [hidden]{display:none!important}

  /* Celebration */
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
  .confetti i{position:absolute;top:-20px;width:10px;height:9px;animation:fall 1.8s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}

  /* Sheet */
  .scrim{position:fixed;inset:0;background:rgba(31,20,24,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--paper);border-radius:24px 24px 0 0;padding:10px 20px calc(var(--safe-bottom) + 24px);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;z-index:41;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain}
  .sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .grab{width:40px;height:5px;border-radius:3px;background:#D8D0CD;margin:0 auto 16px}
  .sheet h3{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--wine-deep);margin-bottom:14px}
  .field{display:grid;gap:6px;margin-bottom:16px}
  .field label{font-size:.85rem;font-weight:600;color:var(--muted)}
  .field input,.field select{font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);width:100%}
  .field p{font-size:.8rem;color:var(--muted)}
  .row{display:flex;gap:10px}
  .btn{flex:1;height:50px;border-radius:14px;font-weight:700}
  .btn.primary{background:var(--wine);color:#fff}
  .btn.ghost{border:1.5px solid var(--line);background:#fff}
  .btn.danger{color:#9E0F25;border:1.5px solid #EBC3C8;background:#fff}
  .confirm{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#fff;border:1.5px solid #EBC3C8;font-size:.88rem}
  .confirm.show{display:block}
  .confirm .row{margin-top:10px}


  /* Daily message */
  .quote{margin:14px auto 0;max-width:34ch;text-align:center;font-family:var(--display);font-size:1.08rem;line-height:1.35;color:var(--wine-deep)}
  .quote::before{content:"“"}.quote::after{content:"”"}

  /* Welcome */
  .welcome{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-top) + 40px) 28px calc(var(--safe-bottom) + 40px);
    background:radial-gradient(120% 80% at 50% 0%, #D21F3C 0%, #B5122B 45%, #6E0A18 100%);color:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
  .welcome.show{opacity:1;pointer-events:auto}
  .welcome .w-in{max-width:420px;margin:0 auto;width:100%}
  .welcome .w-heart{width:56px;height:52px;margin-bottom:28px}
  .welcome .w-day{font-size:.95rem;font-weight:600;color:#FFD9DF;letter-spacing:.02em}
  .welcome .w-hi{margin-top:6px;font-size:1.05rem;color:#FFE9EC}
  .welcome .w-msg{margin-top:22px;font-family:var(--display);font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.12}
  .welcome .w-btn{margin-top:40px;width:100%;height:56px;border-radius:16px;background:#fff;color:var(--wine-deep);font-weight:700;font-size:1.05rem}
  .welcome.show .w-msg{animation:rise .7s .15s both cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 18px);z-index:45;width:min(440px,calc(100% - 32px));transform:translate(-50%,140%);
    background:var(--tc,#B5122B);color:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:.98rem;line-height:1.3;
    box-shadow:0 14px 30px -12px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .toast.show{transform:translate(-50%,0)}
  .toast.big{border:2px solid var(--gold)}
  .toast .ti{width:34px;height:34px;flex:none;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center}
  .toast .ti svg{width:20px;height:20px}

  @media (prefers-reduced-motion: reduce){
    .welcome.show .w-msg{animation:none}
    .toast,.welcome{transition:none}
    .wave{animation:none}
    .liquid,.habit,.check svg,.sheet,.scrim{transition:none}
    .stage.pop svg{animation:none}
    .confetti{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="daycount" id="daycount" aria-live="polite"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="langs" role="group" aria-label="Idioma / Sprache / Language">
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
      <button class="gear" type="button" id="openSettings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="people" role="group" id="people">
    <button type="button" class="person" data-person="hannah" aria-pressed="false">
      <svg class="mini" viewBox="0 0 100 92" aria-hidden="true"><defs><clipPath id="mh"><path d="M50 88C20 66 3 49 3 29 3 14 15 3 29 3c9 0 16 5 21 12C55 8 62 3 71 3c14 0 26 11 26 26 0 20-17 37-47 59z"/></clipPath></defs><path d="M50 88C20 66 3 49 3 29 3 14 15 3 29 3c9 0 16 5 21 12C55 8 62 3 71 3c14 0 26 11 26 26 0 20-17 37-47 59z" fill="#F2EDEB"/><rect class="mini-fill" clip-path="url(#mh)" x="0" y="92" width="100" height="92" fill="#B5122B"/><path d="M50 88C20 66 3 49 3 29 3 14 15 3 29 3c9 0 16 5 21 12C55 8 62 3 71 3c14 0 26 11 26 26 0 20-17 37-47 59z" fill="none" stroke="#B5122B" stroke-width="5"/></svg>
      <span><b>Hannah</b><span class="mini-txt"></span></span>
    </button>
    <button type="button" class="person" data-person="carlos" aria-pressed="false">
      <svg class="mini" viewBox="0 0 100 92" aria-hidden="true"><defs><clipPath id="mc"><path d="M50 88C20 66 3 49 3 29 3 14 15 3 29 3c9 0 16 5 21 12C55 8 62 3 71 3c14 0 26 11 26 26 0 20-17 37-47 59z"/></clipPath></defs><path d="M50 88C20 66 3 49 3 29 3 14 15 3 29 3c9 0 16 5 21 12C55 8 62 3 71 3c14 0 26 11 26 26 0 20-17 37-47 59z" fill="#F2EDEB"/><rect class="mini-fill" clip-path="url(#mc)" x="0" y="92" width="100" height="92" fill="#B5122B"/><path d="M50 88C20 66 3 49 3 29 3 14 15 3 29 3c9 0 16 5 21 12C55 8 62 3 71 3c14 0 26 11 26 26 0 20-17 37-47 59z" fill="none" stroke="#B5122B" stroke-width="5"/></svg>
      <span><b>Carlos</b><span class="mini-txt"></span></span>
    </button>
  </div>

  <div class="stage" id="stage">
    <svg viewBox="0 0 200 184" role="img" id="heartSvg">
      <defs>
        <clipPath id="heartClip"><path d="M100 178C42 136 6 102 6 60 6 30 29 7 58 7c18 0 32 9 42 23C110 16 124 7 142 7c29 0 52 23 52 53 0 42-36 76-94 118z"/></clipPath>
        <linearGradient id="wineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D21F3C"/>
          <stop offset="1" stop-color="#7A0A1C"/>
        </linearGradient>
        <clipPath id="liqClip"><rect id="liqRect" x="0" y="184" width="200" height="220"/></clipPath>
      </defs>
      <path class="heart-bg" d="M100 178C42 136 6 102 6 60 6 30 29 7 58 7c18 0 32 9 42 23C110 16 124 7 142 7c29 0 52 23 52 53 0 42-36 76-94 118z"/>
      <g clip-path="url(#heartClip)">
        <g class="liquid" id="liquid" style="transform:translateY(184px)">
          <g class="wave back"><path d="M0 8 Q25 0 50 8 T100 8 T150 8 T200 8 T250 8 T300 8 T350 8 T400 8 V200 H0z" fill="#E0566A"/></g>
          <g class="wave"><path d="M0 10 Q25 2 50 10 T100 10 T150 10 T200 10 T250 10 T300 10 T350 10 T400 10 V200 H0z" fill="url(#wineGrad)"/></g>
        </g>
      </g>
      <path class="heart-outline" d="M100 178C42 136 6 102 6 60 6 30 29 7 58 7c18 0 32 9 42 23C110 16 124 7 142 7c29 0 52 23 52 53 0 42-36 76-94 118z"/>
      <g class="sc" aria-hidden="true">
        <text class="sn dark" x="100" y="100" text-anchor="middle">0</text>
        <text class="so dark" x="100" y="121" text-anchor="middle"></text>
        <g clip-path="url(#liqClip)">
          <text class="sn light" x="100" y="100" text-anchor="middle">0</text>
          <text class="so light" x="100" y="121" text-anchor="middle"></text>
        </g>
      </g>
    </svg>

  $("pairInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pairJoin").click(); });
  $("pairShare").addEventListener("click", async () => {
    const L = t(), code = pairCode(); if (!code) return;
    const url = location.origin + location.pathname + "#c=" + code;
    const text = L.shareText(code, url);
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch(e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); toast(L.copied, "#B5122B", heartIcon, false); } catch(e) {}
  });

  $("wBtn").addEventListener("click", hideWelcome);
  $("welcome").addEventListener("click", (e) => { if (e.target === $("welcome")) hideWelcome(); });
  $("daycount").addEventListener("click", () => showWelcome(true));
  $("daycount").style.cursor = "pointer";

  renderAll(false);
  showWelcome(false);

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>

(() => {
  "use strict";
  const LBL = { es: ["Reto", "Mi día", "Semana", "Dinero"], en: ["Challenge", "My day", "Week", "Money"], de: ["Challenge", "Mein Tag", "Woche", "Geld"] };
  const frame = document.getElementById("ddFrame"), bar = document.getElementById("tabbar");
  const ls = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const st = () => { try { return JSON.parse(ls("hc90:v1")) || {}; } catch (e) { return {}; } };
  let loadedCode = null, cur = "reto";
  function labels() {
    const l = LBL[st().lang] || LBL.es;
    bar.querySelectorAll("button").forEach((b, i) => { b.querySelector("span").textContent = l[i]; });
  }
  function post(msg) { try { frame.contentWindow.postMessage(msg, location.origin); } catch (e) {} }
  function show(tab) {
    cur = tab;
    bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    if (tab === "reto") { frame.hidden = true; document.body.classList.remove("dd-open"); window.scrollTo(0, 0); return; }
    const code = ls("hc90:v1:code") || "";
    if (!frame.getAttribute("src") || loadedCode !== code) {
      loadedCode = code;
      frame.setAttribute("src", "dd.html?embed=1&tab=" + tab + "&v=" + Date.now());
    } else post({ dd: "tab", tab });
    frame.hidden = false;
    document.body.classList.add("dd-open");
  }
  bar.addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
  document.addEventListener("click", (e) => {
    if (e.target.closest(".langs button")) setTimeout(labels, 0);
    const p = e.target.closest(".person"); if (p) post({ dd: "person", p: p.dataset.person });
  });
  labels();
})();
</script>
<script type="module">
/* Sync between the two phones (Firebase Firestore, free plan).
   Each couple has one document named after its secret code. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDocFromServer, setDoc, updateDoc, onSnapshot, FieldPath, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const H = window.HC;
if (H) {
  const app = initializeApp({
    apiKey: "AIzaSyB_BUu6ey88OXAo6KTWm0Q3HF1uL9WJCbQ",
    authDomain: "nuestros-90-dias.firebaseapp.com",
    projectId: "nuestros-90-dias",
    storageBucket: "nuestros-90-dias.firebasestorage.app",
    messagingSenderId: "420233303737",
    appId: "1:420233303737:web:27829caf35659171542d68"
  });
  let db;
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch (e) { db = getFirestore(app); }

  const CK = H.KEY + ":code";
  const getCode = () => { try { return localStorage.getItem(CK) || ""; } catch (e) { return ""; } };
  const setCode = (c) => { try { localStorage.setItem(CK, c); } catch (e) {} };
  const WORDS = ["cereza","luna","sol","rio","mar","nube","flor","roca","lago","monte","brisa","perla","coco","mango","lima","kiwi","pino","nido","faro","isla","ola","miel","cafe","trigo","menta","rosa","lirio","rayo","cielo","nieve","palma","coral"];
  const VALID = /^[a-z0-9-]{20,64}$/;
  function newCode(){
    const r = new Uint32Array(5); crypto.getRandomValues(r);
    const w = (i) => WORDS[r[i] % WORDS.length], n = (i) => String(r[i] % 10000).padStart(4, "0");
    return `${w(0)}-${w(1)}-${n(2)}-${w(3)}-${n(4)}`;
  }
  const norm = (v) => String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim()
    .replace(/[\s_.,·]+/g, "-").replace(/[^a-z0-9-]/g, "").replace(/-+/g, "-").replace(/^-|-$/g, "");
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

  let ref = null, unsub = null, lastFromCache = true;
  function status(){
    if (!ref) return;
    H.status(!navigator.onLine ? "off" : lastFromCache ? "wait" : "on");
  }
  function connect(code){
    ref = doc(db, "couples", code);
    if (unsub) unsub();
    H.status(navigator.onLine ? "wait" : "off");
    unsub = onSnapshot(ref, { includeMetadataChanges: true }, (snap) => {
      lastFromCache = snap.metadata.fromCache;
      if (snap.exists()) H.apply(snap.data());
      status();
    }, () => H.status("err"));
  }
  addEventListener("online", status);
  addEventListener("offline", status);

  const payload = () => { const S = H.S(); return { start: S.start, tz: S.tz, tzSeen: S.tzSeen }; };

  window.HCSync = {
    async create(){
      if (!navigator.onLine) { H.message("net"); return; }
      const code = newCode(), S = H.S();
      try {
        await withTimeout(setDoc(doc(db, "couples", code), { ...payload(), data: S.data, updated: serverTimestamp() }), 12000);
        setCode(code); H.paired(); connect(code);
      } catch (e) { H.message("err"); }
    },
    async join(raw){
      const code = norm(raw);
      if (!VALID.test(code)) { H.message("bad"); return; }
      if (!navigator.onLine) { H.message("net"); return; }
      try {
        const r = doc(db, "couples", code);
        const snap = await withTimeout(getDocFromServer(r), 12000);
        if (!snap.exists()) { H.message("bad"); return; }
        // Upload what this phone marked that the other phone doesn't have yet
        const remote = snap.data() || {}, S = H.S(), args = [];
        for (const p of ["hannah", "carlos"]) for (const k in S.data[p]) {
          const has = remote.data && remote.data[p] && Object.prototype.hasOwnProperty.call(remote.data[p], k);
          if (!has && S.data[p][k].some(Boolean)) args.push(new FieldPath("data", p, k), S.data[p][k]);
        }
        if (args.length) await withTimeout(updateDoc(r, ...args, "updated", serverTimestamp()), 12000);
        setCode(code); H.paired(); connect(code);
      } catch (e) { H.message(navigator.onLine ? "err" : "net"); }
    },
    mark(p, k, m){ if (ref) updateDoc(ref, new FieldPath("data", p, k), m, "updated", serverTimestamp()).catch(() => {}); },
    meta(){ if (ref) updateDoc(ref, { ...payload(), updated: serverTimestamp() }).catch(() => {}); },
    reset(){ if (ref) updateDoc(ref, { ...payload(), data: { hannah: {}, carlos: {} }, updated: serverTimestamp() }).catch(() => {}); }
  };

  // A shared link (…#c=code) connects this phone automatically
  const m = location.hash.match(/c=([A-Za-z0-9-]+)/);
  if (m) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  const saved = getCode();
  if (saved) connect(saved);
  else if (m) { H.prefill(m[1]); window.HCSync.join(m[1]); }
}
</script>
